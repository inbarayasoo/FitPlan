name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential g++-13 cmake ninja-build pkg-config \
            libssl-dev libsodium-dev libsqlite3-dev libasio-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/dev/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Unit and integration tests
        run: ctest --preset dev

      - name: End-to-end smoke test
        run: ./scripts/smoke.sh

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          git ls-files '*.cpp' '*.hpp' \
            | xargs clang-format --dry-run --Werror
